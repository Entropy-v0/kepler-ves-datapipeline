services:
  db:
    image: postgres:15-alpine
    container_name: kepler_db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"

  kepler:
    build: .
    container_name: kepler
    restart: always
    depends_on:
      - db
    environment:
      - MACHINE_NAME=${MACHINE_NAME}
      - PYTHONUNBUFFERED=1
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_PORT=${DB_PORT}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    tty: true
    stdin_open: true

  kepler_api:
    build: .
    container_name: kepler_api
    restart: always
    depends_on:
      - db
    # Cambiamos el comando para usar uvicorn y habilitar el puerto
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - PYTHONPATH=/app
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_PORT=${DB_PORT}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    tty: true
    stdin_open: true

  kepler_dashboard:
    build: .
    container_name: kepler_dashboard
    restart: always
    depends_on:
      - db
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      - PYTHONPATH=/app
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_PORT=5432
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    tty: true
    stdin_open: true
